# SPIKE (throwaway): issue -> draft PR, with Claude Code running in GitHub Actions.
#
# What this proves: the whole loop happens OUTSIDE this machine.
#   issue labeled 'agent-ready' -> Claude Code (Bedrock) in a GH runner -> branch + draft PR
#   -> the repo's own CI runs on GitHub's runners (quick compile + clippy), no local gate.
#
# Credentials: Bedrock via static AWS session credentials (validate-env accepts
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, OIDC is not required for this path).
# The session token expires; re-create the secrets when it does.
name: Agent Issue (spike)

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt'
        required: true
      issue_number:
        description: 'Issue number (the body of that issue is the task)'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  claude:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'agent-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_USE_BEDROCK: '1'
      AWS_REGION: us-east-2
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      ANTHROPIC_DEFAULT_SONNET_MODEL: us.anthropic.claude-sonnet-5
      ANTHROPIC_DEFAULT_HAIKU_MODEL: us.anthropic.claude-haiku-4-5-20251001-v1:0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: agent-ready
          display_report: 'true'
          claude_args: |
            --model us.anthropic.claude-sonnet-5
            --max-turns 40
            --allowedTools Edit,Read,Write,Glob,Grep,Bash(git:*),Bash(cargo:*),Bash(rustc:*),Bash(ls:*),Bash(cat:*),Bash(rg:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(mkdir:*),Bash(cp:*),Bash(rm:*),Bash(find:*),Bash(test:*),Bash(echo:*),Bash(cat:*),Bash(mkdir:*)
          prompt: |
            You are working in the SolidCraft repository. The task is issue #${{ github.event.issue.number || inputs.issue_number }}.

            ## The task

            ${{ github.event.issue.title || inputs.prompt }}

            ${{ github.event.issue.body || inputs.prompt }}

            ## The rules of this repository

            Read AGENTS.md at the root of the repository first and follow it. In particular:
            - the test goes in the same file as the code it tests, in the `mod tests` block that
              is already there;
            - the code and the test are written in English;
            - the quality gate is `cargo xtask ci`, but for a change this small run the narrow
              gate: `cargo fmt` on the touched crate and `cargo test -p <crate>`;
            - one topic, one issue, one pull request.

            ## What to do

            1. Implement the task and its test. Touch only the files the task needs.
            2. Run the narrow gate (`cargo fmt --all`, `cargo test -p <crate>`) and make it pass.
            3. Commit with a message that references the issue, push the branch, and open a
               **draft** pull request against `main` (this repository's convention: a claim is
               a draft PR).

            ## What you must not do

            - Do not merge, close, or rebase anything. Do not push to `tangency-labs/solidcraft`.
            - Do not change the CI workflows, the xtask, or the repository rules.
            - Do not run the full `cargo xtask ci`; it takes about 90 minutes on a saturated
              machine and the pull request's own CI does it on GitHub's runners.
